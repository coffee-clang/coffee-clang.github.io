name: Deploy static site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'
      - name: Build site with mdbook
        run: |
          bash scripts/generate-downloads.sh
          mdbook build
          cp normalize.css brand.css cup.css mdbook.css book/
          cp -r fonts/ book/fonts/
          cp logo.svg copy-icon.svg book/
          rm -rf book/FontAwesome/ book/fonts/ book/css/ book/highlight.js book/highlight.css book/elasticlunr.min.js book/mark.min.js book/searcher.js book/searchindex.* book/ayu-highlight.css book/tomorrow-night.css book/clipboard.min.js book/favicon.png book/favicon.svg book/_downloads.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'book'
      - id: deployment
        uses: actions/deploy-pages@v5
